<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_cover_indus_valley.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A04000"/>
      <stop offset="100%" stop-color="#3E1900"/>
    </linearGradient>
    <pattern id="arch_pat_cover_indus_valley.svg" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 0 15 L 15 0 L 30 15 L 15 30 Z" fill="none" stroke="#FAD7A0" stroke-width="0.7" opacity="0.12"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="580" rx="8" fill="url(#grad_cover_indus_valley.svg)"/>
  <rect width="400" height="580" fill="url(#arch_pat_cover_indus_valley.svg)"/>
  
  <!-- Border and decorative frame -->
  <rect x="18" y="18" width="364" height="544" rx="4" fill="none" stroke="#FAD7A0" stroke-width="1.8" opacity="0.75"/>
  <rect x="25" y="25" width="350" height="530" rx="2" fill="none" stroke="#FAD7A0" stroke-width="0.8" opacity="0.4"/>
  
  <!-- Corner Ornaments -->
  <circle cx="28" cy="28" r="5" fill="#FAD7A0" opacity="0.8"/>
  <circle cx="372" cy="28" r="5" fill="#FAD7A0" opacity="0.8"/>
  <circle cx="28" cy="552" r="5" fill="#FAD7A0" opacity="0.8"/>
  <circle cx="372" cy="552" r="5" fill="#FAD7A0" opacity="0.8"/>
  
  <!-- Header Institution Tag -->
  <text x="200" y="65" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="11" font-weight="700" fill="#FAD7A0" letter-spacing="2.5" opacity="0.9">RTM NAGPUR UNIVERSITY</text>
  <text x="200" y="82" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#FFFFFF" letter-spacing="1" opacity="0.7">DEPT. OF ANCIENT INDIAN HISTORY &amp; ARCHAEOLOGY</text>
  
  <line x1="60" y1="100" x2="340" y2="100" stroke="#FAD7A0" stroke-width="1.2" opacity="0.6"/>
  <polygon points="200,96 205,100 200,104 195,100" fill="#FAD7A0"/>
  
  <!-- Era Tag -->
  <rect x="110" y="125" width="180" height="24" rx="12" fill="#FAD7A0" opacity="0.18"/>
  <text x="200" y="141" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FAD7A0" letter-spacing="1.2">Protohistory (2600-1900 BCE)</text>

  <!-- Title -->
  <foreignObject x="45" y="175" width="310" height="170">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center;">
      <h1 style="color:#FFFFFF; font-family:'Cinzel', 'Georgia', serif; font-size:22px; font-weight:700; margin:0 0 10px 0; line-height:1.3; text-shadow:0 2px 4px rgba(0,0,0,0.6);">Harappa & Mohenjo-Daro Excavations</h1>
      <p style="color:#FAD7A0; font-family:'Merriweather', serif; font-size:12px; margin:0; line-height:1.4; font-style:italic;">Bronze Age Urbanism & Seals</p>
    </div>
  </foreignObject>

  <!-- Central Seal Emblem -->
  <circle cx="200" cy="385" r="42" fill="none" stroke="#FAD7A0" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="385" r="36" fill="rgba(0,0,0,0.25)" stroke="#FAD7A0" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="200" y="392" text-anchor="middle" font-family="'Cinzel', serif" font-size="20" fill="#FAD7A0" opacity="0.9">&#9884;</text>

  <!-- Author & Bottom Banner -->
  <line x1="60" y1="465" x2="340" y2="465" stroke="#FAD7A0" stroke-width="1" opacity="0.6"/>
  <text x="200" y="495" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" letter-spacing="0.5">Sir John Marshall</text>
  <text x="200" y="525" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#FAD7A0" letter-spacing="1.5" opacity="0.85">DIGITAL RESEARCH ARCHIVE</text>
</svg>